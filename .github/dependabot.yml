version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    labels:
      - dependencies
      - go
      # TODO: Change this to Auto-Changelog after the first release
      - Skip-Changelog
    groups:
      go-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
      exclude:
        - "github.com/fastly/go-fastly/*"

  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - tools
      - go
      - Skip-Changelog
    groups:
      tools-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
      - github_actions
      - Skip-Changelog
    groups:
      gha-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
